<!doctype html>
<html lang="es" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0A0A0A" />

    <!-- Tema (oscuro por defecto) aplicado antes del render para evitar parpadeo -->
    <script>
      (function () {
        try {
          var t = localStorage.getItem('axis-theme')
          if (t === 'light') {
            document.documentElement.setAttribute('data-theme', 'light')
            var m = document.querySelector('meta[name="theme-color"]')
            if (m) m.setAttribute('content', '#f5f3ee')
          }
        } catch (e) {}
      })()
    </script>

    <title>AXIS Vision — Gafas con inteligencia artificial</title>
    <meta
      name="description"
      content="AXIS Vision: gafas con inteligencia artificial. Vídeo, foto, traducción en vivo y lentes con tu fórmula. Reserva las tuyas por WhatsApp."
    />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="AXIS Vision — Una nueva forma de ver el mundo" />
    <meta
      property="og:description"
      content="Gafas con inteligencia artificial, hechas para llevarse puestas todo el día. Reserva las tuyas."
    />
    <meta property="og:image" content="/og-image.jpg" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:locale:alternate" content="en_US" />
    <meta name="twitter:card" content="summary_large_image" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
